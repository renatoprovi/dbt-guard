# Source layer: declarative contract for governance (PII).
# dbt-guard uses the security_tag meta key to trace sensitivity through lineage.
version: 2
sources:
  - name: raw
    description: Raw layer for lineage and PII testing
    schema: raw
    tables:
      - name: raw_customers
        description: Customer table at the source
        columns:
          - name: ssn
            description: Customer SSN (sensitive data)
            config:
              meta:
                security_tag: pii
          - name: name
            description: Customer name
